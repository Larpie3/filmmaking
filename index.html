<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northbridge Media Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="brand" id="brand-link">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">
          <span class="brand-name">Northbridge Media Archive</span>
          <span class="brand-sub">Student &amp; campus productions</span>
        </span>
      </a>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="6" stroke="currentColor" stroke-width="1.6"/>
          <line x1="13.1" y1="13.1" x2="18" y2="18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search the archive by title, tag, or year" autocomplete="off">
      </div>
    </div>
  </header>

  <main>

    <!-- GALLERY VIEW -->
    <section id="view-gallery" class="view">
      <div class="gallery-heading">
        <h1>The Archive</h1>
        <p id="result-count" class="result-count">Loading catalog&hellip;</p>
      </div>

      <div id="gallery-grid" class="gallery-grid" aria-live="polite"></div>

      <p id="empty-state" class="empty-state" hidden>
        No entries match that search. Try a different title, tag, or year.
      </p>
    </section>

    <!-- WATCH VIEW -->
    <section id="view-watch" class="view" hidden>
      <button type="button" id="back-btn" class="back-btn">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12.5 15L7 10l5.5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back to the archive
      </button>

      <div class="watch-layout">
        <div class="watch-main">
          <div class="player-frame">
            <video id="player" controls controlsList="nodownload" playsinline></video>
          </div>

          <h1 id="watch-title" class="watch-title"></h1>
          <div class="watch-meta">
            <span id="watch-date"></span>
            <span class="meta-dot" aria-hidden="true"></span>
            <span id="watch-duration"></span>
          </div>
          <div id="watch-tags" class="watch-tags"></div>
          <p id="watch-description" class="watch-description"></p>
        </div>

        <aside class="watch-sidebar">
          <h2 class="sidebar-heading">More from the archive</h2>
          <div id="sidebar-list" class="sidebar-list"></div>
        </aside>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>Northbridge Media Archive &mdash; a viewing-only record of school productions.</p>
  </footer>

  <script src="videos.js"></script>
  <script src="script.js"></script>
</body>
</html>
